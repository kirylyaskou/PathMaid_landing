<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta
      name="description"
      content="Return to PathMaid after connecting Google Drive."
    >
    <meta name="referrer" content="no-referrer">
    <title>PathMaid — Google sign-in</title>
    <link rel="icon" type="image/png" sizes="128x128" href="../assets/pathmaid-icon-128.png">
    <style>
      :root {
        --bg: #0f0705;
        --panel: rgba(31, 18, 13, 0.88);
        --ink: #fff5dc;
        --muted: #d9c6a1;
        --gold: #f0a000;
        --gold-bright: #ffd35a;
        --rule: rgba(255, 211, 90, 0.26);
        --danger: #ff7b5d;
        --shadow: rgba(0, 0, 0, 0.48);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-width: 320px;
        margin: 0;
      }

      body {
        min-height: 100vh;
        background:
          radial-gradient(ellipse at top right, rgba(240, 160, 0, 0.1), transparent 65%),
          var(--bg);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      a {
        color: inherit;
      }

      .page {
        display: grid;
        grid-template-columns: minmax(18rem, 30rem) minmax(0, 1fr);
        grid-template-areas: "content artwork";
        align-items: center;
        gap: clamp(1.25rem, 3vw, 3rem);
        min-height: 100vh;
        max-width: 120rem;
        margin: 0 auto;
        padding: clamp(1rem, 3vw, 3rem);
      }

      .artwork {
        grid-area: artwork;
        display: block;
        width: 100%;
        height: auto;
        max-height: calc(100vh - 6rem);
        object-fit: contain;
        border-radius: 0.5rem;
      }

      .card {
        grid-area: content;
        justify-self: center;
        width: min(100%, 34rem);
        padding: clamp(1.25rem, 4vw, 2rem);
        border: 1px solid var(--rule);
        border-radius: 0.5rem;
        background:
          linear-gradient(180deg, rgba(255, 211, 90, 0.08), transparent 38%),
          var(--panel);
        box-shadow: 0 1.5rem 4rem var(--shadow);
      }

      .mark {
        display: inline-flex;
        align-items: center;
        gap: 0.625rem;
        margin-bottom: 2rem;
        color: var(--gold-bright);
        font-size: 0.8rem;
        font-weight: 900;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .mark img {
        width: 2rem;
        height: 2rem;
        border: 1px solid var(--rule);
        border-radius: 0.25rem;
      }

      .eyebrow {
        margin: 0 0 0.75rem;
        color: var(--gold);
        font-size: 0.78rem;
        font-weight: 900;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2.25rem, 6vw, 3.5rem);
        line-height: 1.05;
        letter-spacing: 0;
        overflow-wrap: anywhere;
      }

      .lead {
        max-width: 28rem;
        margin: 1.25rem 0 0;
        color: var(--muted);
        font-size: clamp(1rem, 2.4vw, 1.2rem);
        line-height: 1.6;
      }

      .return-button {
        display: inline-flex;
        margin-top: 1.5rem;
        padding: 0.9rem 1.25rem;
        border: 1px solid var(--gold-bright);
        border-radius: 0.375rem;
        background: var(--gold);
        color: #180b04;
        font-weight: 800;
        text-decoration: none;
      }

      .return-button:hover {
        background: var(--gold-bright);
      }

      .return-button:focus-visible {
        outline: 3px solid var(--ink);
        outline-offset: 4px;
      }

      .return-hint {
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.5;
      }

      body[data-state="error"] .eyebrow {
        color: var(--danger);
      }

      @media (max-width: 960px) {
        .page {
          grid-template-columns: minmax(0, 1fr);
          grid-template-areas: "artwork" "content";
          min-height: auto;
        }

        .artwork {
          max-height: none;
        }
      }
    </style>
  </head>
  <body data-state="ready">
    <main class="page">
      <img class="artwork" src="../assets/auth-confirmed-success.png" width="1448" height="1086" alt="">
      <section class="card" aria-live="polite">
        <a class="mark" href="../" aria-label="PathMaid home">
          <img src="../assets/pathmaid-icon-128.png" alt="">
          <span>PathMaid</span>
        </a>
        <p id="status-label" class="eyebrow">Google Drive</p>
        <h1 id="status-title">Return to PathMaid.</h1>
        <p id="status-description" class="lead">Finish connecting Google in the app. Use the button below to return to PathMaid.</p>
        <a id="return-button" class="return-button" href="pathmaid://open">Open PathMaid</a>
        <p id="return-hint" class="return-hint">Your browser may ask permission to open the app. If nothing happens, switch back to PathMaid manually.</p>
      </section>
    </main>
    <script>
      const params = new URLSearchParams(window.location.search)
      const status = params.get('status')
      const state = status === 'success' || status === 'error' ? status : 'ready'
      window.history.replaceState(null, '', window.location.pathname)
      document.body.dataset.state = state
      const russian = navigator.language.toLowerCase().startsWith('ru')
      document.documentElement.lang = russian ? 'ru' : 'en'
      const text = russian ? {
        ready: ['Вернуться в PathMaid.', 'Завершите подключение Google в приложении. Нажмите кнопку ниже, чтобы вернуться в PathMaid.'],
        success: ['Google Drive подключён.', 'Подключение сохранено. Вернитесь в PathMaid, чтобы сохранить архив или восстановить его из Google Drive.'],
        error: ['Вход не завершён.', 'Вернитесь в PathMaid, проверьте сообщение и попробуйте подключить Google ещё раз.'],
        button: 'Открыть PathMaid',
        hint: 'Браузер может запросить разрешение на открытие приложения. Если ничего не произошло, вернитесь в PathMaid вручную.'
      } : {
        ready: ['Return to PathMaid.', 'Finish connecting Google in the app. Use the button below to return to PathMaid.'],
        success: ['Google Drive connected.', 'Your connection is saved. Return to PathMaid to save or restore ZIP archives in Google Drive.'],
        error: ['Sign-in was not completed.', 'Return to PathMaid, check the message, and try connecting Google again.'],
        button: 'Open PathMaid',
        hint: 'Your browser may ask permission to open the app. If nothing happens, switch back to PathMaid manually.'
      }
      document.getElementById('status-title').textContent = text[state][0]
      document.getElementById('status-description').textContent = text[state][1]
      document.getElementById('return-button').textContent = text.button
      document.getElementById('return-hint').textContent = text.hint
      if (state === 'success') {
        window.setTimeout(() => window.location.assign('pathmaid://open'), 500)
      }
    </script>
  </body>
</html>
